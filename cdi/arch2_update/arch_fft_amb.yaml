# 第 2 步(相位未知)—— arch=fft + 歧異性不變 loss(實驗設計 §二十一)
#
# 第 1 步(§二十):給了相位時,內建反傅立葉轉換的網路直接到達物理上限(0.77)。
# 本步不給相位,檢驗網路能否自己完成相位回復:
#   fft     單次:偵測器端估相位 -> 固定反轉換 -> 實空間 U-Net
#   unroll  展開 HIO 5 輪,每輪 = 固定的傅立葉約束 + 固定的 HIO 更新 + 學習的修正
#
# 本組與 amb_base.yaml **只差 arch**(check_arch2.py 以程式驗證);
# 現況條件(beamstop 3、劑量 1e3),歧異性不變 loss 開啟。
canvas: 64
digit: 28
support_pad: 2
phase_max: 1.5707963268
mat_abs:
- 0.3
- 1.0
mat_pha:
- 1.0
- 0.7
amp_floor: 0.05
beamstop_r: 3.0
photons_per_pix: 1000.0
add_poisson: true
input_transform: none
base_channels: 32
n_down: 3
w_phase: 1.0
w_dc: 0.1
w_freq: 0.0
freq_power: 1.0
epochs: 40
batch_size: 128
lr: 0.002
subset_n: 20000
test_seed: 1234
eval_n: 512
gen_n: 256
data_root: /work/elviss0915/data
deterministic: false
input_norm: global
train_sources:
- procedural
match_support_to: 0.0318
oracle_phase: false
w_amp_out: 1.0
eval_photons:
- 1000.0
- 100000.0
eval_beamstops:
- 0.0
- 3.0
amb_invariant: true
amb_max_shift: 4
arch: fft
