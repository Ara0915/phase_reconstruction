# 架構比較(實驗設計 §十九):oracle + arch=fft
#
# 問題:U-Net 即使給了繞射相位,在 polygon / bandpass 上仍學不會反傅立葉轉換(§十八:0.11 / 0.04)。
# 換架構後能否學會?
#
# 本組與 ideal_bs0_ph1e5_oracle.yaml **只差 arch**(check_arch.py 以程式驗證)。
# 選理想條件(beamstop 0、劑量 1e5):雜訊 1%,給了相位後一次反傅立葉轉換即可近乎完美重建,
# 失敗只能歸因於架構。
canvas: 64
digit: 28
support_pad: 2
phase_max: 1.5707963268
mat_abs:
- 0.3
- 1.0
mat_pha:
- 1.0
- 0.7
amp_floor: 0.05
beamstop_r: 0.0
photons_per_pix: 100000.0
add_poisson: true
input_transform: none
base_channels: 32
n_down: 3
w_phase: 1.0
w_dc: 0.1
w_freq: 0.0
freq_power: 1.0
epochs: 40
batch_size: 128
lr: 0.002
subset_n: 20000
test_seed: 1234
eval_n: 512
gen_n: 256
data_root: /work/elviss0915/data
deterministic: false
input_norm: global
train_sources:
- procedural
match_support_to: 0.0318
oracle_phase: true
w_amp_out: 1.0
eval_photons:
- 1000.0
- 100000.0
eval_beamstops:
- 0.0
- 3.0
arch: fft
