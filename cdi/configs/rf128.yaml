# 過取樣重做 — canvas=128, dilation=3
#
# 過取樣實驗的重做:隔離「感受野涵蓋率」這個混淆變因。
#
# 問題:原過取樣實驗(canvas 64/96/128,物體固定 28)原意在測
# 「增加已知為零的區域」的效果,但畫布放大同時改變了兩件事:
#   (a) 空白區變多 —— 約束增加,對重建有利
#   (b) 感受野涵蓋率由 183% 降至 91% —— 對重建不利
# 傅立葉轉換為全域算子,頻域每一點由實空間所有像素貢獻,
# 故涵蓋率下降會直接損害重建。兩效應方向相反且混在一起,
# 原實驗未能乾淨測到約束的效果。
#
# 實測(振幅損失修正後)FRC gain 隨過取樣率單調下降:
#   os64 (2.29) 0.1392 / os96 (3.43) 0.1247 / os128 (4.57) 0.1162
# 與感受野涵蓋率的順序完全一致(183% / 122% / 91%)。
#
# 解法:以 dilation 擴大感受野,在**參數量完全不變**的前提下對齊涵蓋率
# (皆為 1,928,450 個參數,已驗證)。若改以增加 n_down 來補,
# 參數量會由 193 萬跳至 777 萬(+303%),等於同時改變容量,無法歸因。
#
#   canvas 64  dilation 1 -> 感受野 117,涵蓋率 183%
#   canvas 96  dilation 2 -> 感受野 177,涵蓋率 184%
#   canvas 128 dilation 3 -> 感受野 237,涵蓋率 185%
#
# 對齊後,過取樣率成為唯一變因:
#   gain 仍隨過取樣率下降 -> 增加空白區確實有害,需另尋解釋
#   gain 變為持平或上升   -> 原趨勢確為感受野造成,約束本身無害
#
# 完整檔案,不繼承任何東西 —— 出錯時可直接 diff 兩個 config。
canvas: 128
digit: 28
support_pad: 2
phase_max: 1.5707963268
mat_abs:
- 0.3
- 1.0
mat_pha:
- 1.0
- 0.7
amp_floor: 0.05
beamstop_r: 3.0
photons_per_pix: 1000.0
add_poisson: true
input_transform: none
base_channels: 32
n_down: 3
w_phase: 1.0
w_dc: 0.1
w_freq: 0.0
freq_power: 1.0
epochs: 40
batch_size: 128
lr: 0.002
subset_n: 20000
test_seed: 1234
eval_n: 512
gen_n: 256
data_root: /work/elviss0915/data
deterministic: false
input_norm: global
train_sources:
- procedural
match_support_to: null
dilation: 3
w_amp_out: 1.0
