# §1b.6 理想條件驗證 —— 理想條件下的 Oracle(天花板)
#
# 與 ideal_bs0_ph1e5.yaml 唯一差異:oracle_phase: true
#
# ---- 為什麼需要這一組 ----
# 只看正常路徑的絕對值,無法判斷「改善了多少算大幅」。
# 有了同條件下的 Oracle,才能看**落差有沒有收斂** ——
# 這是最強形式的陽性結果。
#
# 現況條件下的落差已知:
#   v2_proc (正常路徑)        FRC gain ~0.21
#   v2_proc_oracle (相位已知)  FRC gain  0.2924   (§11.3 註)
#
# 若理想條件下正常路徑逼近 Oracle,即表示
# 「移除 beamstop 與雜訊之後,相位遺失本身已不再是主要障礙」——
# 這正是「不穩定性來自偏離理想條件」最直接的證據。
#
# 反之若落差維持不變,代表相位遺失的代價與量測條件無關,
# 核心論述須重新檢討。
#
# ---- Oracle 的診斷邏輯在此仍然成立 ----
# 本階段尚無探針,故 Oracle 的任務仍是純粹的反傅立葉轉換
# (線性、有封閉解、與物體外觀無關),§4.6 的論證完整適用。
#
# 注意:進入階段四(探針照明)後此論證會斷裂 ——
# 屆時目標是物體 O,但從完整場只能直接得到出射波 ψ = P·O,
# 要拿到 O 必須除以 P,而聚焦探針邊緣 |P| -> 0 為病態。
# 詳見「階段四實驗設計協定 §五」。
