# 訓練資料來源對照 — 程序生成(每樣本獨一無二)
#
# PCA 有效維度 227(相同 support 密度下為 MNIST 的 3.29 倍),
# 最近鄰距離 2.12 倍。contrast_gamma=0.42 對齊 MNIST 的平均振幅 0.405。
#
# 完整檔案,不繼承任何東西 —— 出錯時可直接 diff 兩個 config。
canvas: 64
digit: 28
support_pad: 2
phase_max: 1.5707963268
mat_abs:
- 0.3
- 1.0
mat_pha:
- 1.0
- 0.7
amp_floor: 0.05
beamstop_r: 3.0
photons_per_pix: 1000.0
add_poisson: true
input_transform: none
base_channels: 32
n_down: 3
w_phase: 1.0
w_dc: 0.1
w_freq: 0.0
freq_power: 1.0
epochs: 12
batch_size: 128
lr: 0.002
subset_n: 20000
test_seed: 1234
eval_n: 512
gen_n: 256
data_root: /work/elviss0915/data
deterministic: false
input_norm: global
train_sources:
- procedural
match_support_to: 0.0318
