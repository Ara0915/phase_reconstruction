# §1b.6 理想條件驗證 —— 基準組(現況條件)
#
# 本組與 v2_proc.yaml **訓練設定完全相同**,唯一新增的是 eval_photons /
# eval_beamstops(只影響評估,不影響訓練)。故本組同時擔任兩個角色:
#
#   1. 理想條件實驗的基準組
#   2. **重現性檢查** —— FRC gain 應重現 v2_proc 的既有數值。
#      若差異超過 seed 波動(FRC gain 約 ±0.002~0.004),先停下來查環境,
#      後面所有比較都不可信。
#
# ---- 為什麼要重跑而不是引用舊數字 ----
# 研究日誌 §B3:早期設定(bs*、src_*、e40_*、os*)帶有系統性振幅偏差,
# 絕對數值不可與後期設定並列。在同一批次、同一版程式碼下重跑基準,
# 可排除整類版本差異問題,成本只有 3 個 job。
#
# ---- 交叉評估矩陣 ----
# eval_photons × eval_beamstops = 2 × 2,四個格子:
#   ph1000_bs3    <- 本組的主場(訓練條件)
#   ph100000_bs0  <- 理想條件
#   ph1000_bs0 / ph100000_bs3  <- 單一變因
#
# 用途:把「訓練條件的效果」與「量測條件的效果」分開。
# 若只比 ideal_base(主場)vs ideal_bs0_ph1e5(主場),兩者混在一起。
#
# **注意**:離開主場的格子(ph=100000)會帶有 §12b.4 的正規化假影 ——
# log_mean 是在 ph=1000 下校正的,劑量變 100 倍會使輸入整體平移 ln(100)=4.605。
# 該欄位的退化**不可解讀為物理效應**;它反而是待辦 2(輸入正規化對劑量偏移
# 的敏感度)的直接量測。
