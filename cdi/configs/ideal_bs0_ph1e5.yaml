# §1b.6 理想條件驗證 —— 主臂(移除兩項真正違反定理的條件)
#
# ============================================================================
# 這個實驗在問什麼
# ============================================================================
# 研究日誌 §一之二 把本專案的核心論述改成:
#
#   「解在理論上唯一(Bruck & Sodin 1979;Hayes 1982),
#     但在本專案的量測條件下逆映射不穩定。」
#
# 該論述目前只有**間接**支持(w_dc、HIO、Oracle 三項)。
# 本實驗直接檢驗它:把量測條件推到接近定理的理想假設,
# 看相位未知的正常路徑會不會大幅改善。
#
#   會改善   -> 核心診斷坐實,階段四、五的動機成立
#   不改善   -> 診斷可能是錯的,必須在投入數週 ptychography 前重想
#
# 兩種結果都有價值 —— 這是設計良好的實驗的特徵。
#
# ============================================================================
# 為什麼只動 beamstop 與劑量,不動過取樣
# ============================================================================
# §1b.6 原文寫「beamstop 設為 0、劑量提高、**過取樣顯著提高**」三項一起推。
# 本設計刻意**把過取樣拆出去**,理由有二:
#
# (一)過取樣 2.29 並未違反定理,只是餘裕薄。
#      §1b.3 的四項偏離中,真正**字面上違反**的只有:
#        - 完整傅立葉強度  -> beamstop 遮蔽中心(缺資料)      <- 本組移除
#        - 精確量測        -> Poisson 雜訊                    <- 本組移除
#      而「充分過取樣」的門檻是 2,本專案已是 2.29,**已滿足**。
#      它影響的是條件數(穩定性),不是唯一性,屬二階效應。
#
# (二)過取樣對主指標的作用方向與假設相反。
#      §12.3 實測:過取樣率 2.29 -> 4.57 時 FRC gain 0.1400 -> 0.1147(變差)。
#      三項綁在一起推,可能出現 beamstop+劑量帶來改善、過取樣帶來惡化,
#      **互相抵消、FRC gain 看似沒動**,誤判為「理想條件也沒用」——
#      **在本專案最重要的實驗上產生假陰性。**
#
# 過取樣改列為獨立的第三臂(4-0c),與 ovs64/ovs128 配對比較。
#
# ============================================================================
# 劑量取值的依據(不是隨便挑的)
# ============================================================================
# 由 §假設 1 的實測反推:
#   現況 ph=1000   -> Nyquist 附近 88.6 光子/px -> 1/sqrt(88.6)  = 10.6% 相對雜訊
#   本組 ph=100000 -> Nyquist 附近 8860 光子/px -> 1/sqrt(8860)  =  1.06%
# 相對雜訊降一個數量級。
#
# 取 100 倍(而非精確達 1% 所需的 112.9 倍)是為了讓 log 平移量恰為
# ln(100) = 4.605,方便做正規化常數的數值斷言(見下)。
#
# **須註明**:100,000 光子/px 在真實實驗中並不現實,且本模型未含偵測器飽和
# (附錄 C)。這是**刻意的理想化** —— 目的是逼近定理的理想假設,
# 不是模擬可實現的實驗。報告時須明講。
#
# ============================================================================
# 正規化常數 —— 已確認程式會自動處理
# ============================================================================
# 劑量 ×100 會讓輸入整體平移 ln(100) = 4.605。
# §12b.4 已證實劑量只變 3 倍(平移 1.099)就足以讓表現不升反降。
#
# 已查核 train.py:72 與 physics.py:calibrate_input_norm ——
# log_mean / log_std / ac_scale 在 log_mean is None 時**於訓練開始前
# 以該 run 自己的 cfg.photons_per_pix 重新校正**,並寫入 config_used.json;
# eval.py 讀回同一組值。故本組會自動取得正確的常數。
#
# **仍須斷言**(送出後檢查):
#   ideal_bs0_ph1e5 的 log_mean 應比 ideal_base 高約 4.6。
#   兩者相同 = 沒有重新校正,停下來查。
