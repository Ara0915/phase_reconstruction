# Oracle + 程序生成 — beamstop r=0(對照 os64)
#
# 階段一:程序生成產生器的驗收。
#
# 建立產生器的目的是消除「辨識類別後由記憶重繪」的捷徑,
# 故驗收標準為以 Oracle 重跑泛化測試。Oracle 的任務是反傅立葉轉換 ——
# 線性、有封閉解、與物體外觀完全無關,學會了就該在任何分布上表現一致。
#
# 判讀一(捷徑是否消除):
#   oracle + MNIST       泛化落差 14.83 dB(已有)
#   oracle + procedural  泛化落差 ?
#   明顯縮小 -> 產生器達成目的;沒縮小 -> 需重新規劃方向
#
# 判讀二(材料反演的可達性):
#   目前 procedural 上所有設定的材料 MAE(0.33-0.42)皆劣於平庸基準(0.29-0.30),
#   而 MNIST 上普遍優於基準(oracle 0.162 vs 基準 0.403)。
#   Oracle 若能在 procedural 上解出材料 -> 是模型能力不足,值得繼續攻;
#   若連 Oracle 也解不出 -> 指標在該資料集上不適用,需重新設計。
#
# 此為自洽比較(同一模型在不同分布上的表現),
# 不涉及研究日誌 7.6 所述的跨資料集比較問題。
#
# 完整檔案,不繼承任何東西 —— 出錯時可直接 diff 兩個 config。
canvas: 64
digit: 28
support_pad: 2
phase_max: 1.5707963268
mat_abs:
- 0.3
- 1.0
mat_pha:
- 1.0
- 0.7
amp_floor: 0.05
beamstop_r: 0.0
photons_per_pix: 1000.0
add_poisson: true
input_transform: none
base_channels: 32
n_down: 3
w_phase: 1.0
w_dc: 0.1
w_freq: 0.0
freq_power: 1.0
epochs: 12
batch_size: 128
lr: 0.002
subset_n: 20000
test_seed: 1234
eval_n: 512
gen_n: 256
data_root: /work/elviss0915/data
deterministic: false
input_norm: global
train_sources:
- procedural
match_support_to: 0.0318
oracle_phase: true
