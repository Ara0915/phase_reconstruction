# 平凡歧異性不變的訓練目標 —— 網路的模糊是否來自「猜不到位置與方向」?
#
# 背景(研究日誌 §十四、實驗設計 §十二、§十四):
#   物體平移、或共軛翻轉再加全域相位 φ_max,繞射強度完全相同,
#   本專案的約束排除不了。監督式訓練每張輸入只給其中一個作為答案。
#   實測:網路在 lattice 上 0.50,在 polygon / bandpass 上僅約 0.02(≈ 平庸基準),
#   且輸出含與輸入無關的固定圖樣;純 HIO(對齊後)則在三種原型上皆 0.38–0.73。
#
# 本組與 ideal_base.yaml **只差兩欄**(check_amb.py 以程式驗證):
#   amb_invariant: true   算 loss 前先把真值換成與網路輸出最接近的等價版本
#   amb_max_shift: 4      允許的平移範圍 ±4 px(純 HIO 實測平移中位數 2 px)
#
# 評估一律採「對齊後」的分數與 ideal_base 比較(check_amb.py),
# 因為本組的網路本來就被允許輸出平移或翻轉的版本。
canvas: 64
digit: 28
support_pad: 2
phase_max: 1.5707963268
mat_abs:
- 0.3
- 1.0
mat_pha:
- 1.0
- 0.7
amp_floor: 0.05
beamstop_r: 3.0
photons_per_pix: 1000.0
add_poisson: true
input_transform: none
base_channels: 32
n_down: 3
w_phase: 1.0
w_dc: 0.1
w_freq: 0.0
freq_power: 1.0
epochs: 40
batch_size: 128
lr: 0.002
subset_n: 20000
test_seed: 1234
eval_n: 512
gen_n: 256
data_root: /work/elviss0915/data
deterministic: false
input_norm: global
train_sources:
- procedural
match_support_to: 0.0318
oracle_phase: false
w_amp_out: 1.0
eval_photons:
- 1000.0
- 100000.0
eval_beamstops:
- 0.0
- 3.0
amb_invariant: true
amb_max_shift: 4
