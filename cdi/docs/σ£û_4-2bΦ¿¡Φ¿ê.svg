<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#111">4-2b（HIO 部分）：已知的複數探針能不能打破翻轉？</text>
  <text x="30" y="66" font-size="13" fill="#555">不訓練網路；7 個探針 × 4 種 HIO；同一批物體、同樣劑量；照亮範圍都與平頂圓盤相當（約 448 px）</text>

  <!-- ===== 探針 ===== -->
  <text x="30" y="102" font-size="15" font-weight="700" fill="#111">① 探針（都已知）</text>
  <g font-size="12" fill="#111">
    <rect x="30" y="114" width="126" height="78" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="93" y="136" text-anchor="middle" font-weight="700">DISK</text>
    <text x="93" y="155" text-anchor="middle">平頂圓盤 r = 12</text>
    <text x="93" y="173" text-anchor="middle" fill="#555">= 4-1 / 4-2a（基準）</text>

    <rect x="164" y="114" width="126" height="78" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="227" y="136" text-anchor="middle" font-weight="700">AMP = |DEF|</text>
    <text x="227" y="155" text-anchor="middle">振幅同 DEF</text>
    <text x="227" y="173" text-anchor="middle" fill="#555">沒有相位（對照組）</text>

    <rect x="298" y="114" width="126" height="78" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="361" y="136" text-anchor="middle" font-weight="700" fill="#c2410c">DEF</text>
    <text x="361" y="155" text-anchor="middle">離焦 π</text>
    <text x="361" y="173" text-anchor="middle" fill="#555">主要的複數探針</text>

    <rect x="432" y="114" width="126" height="78" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="495" y="136" text-anchor="middle" font-weight="700" fill="#c2410c">DEF2</text>
    <text x="495" y="155" text-anchor="middle">離焦 2π</text>
    <text x="495" y="173" text-anchor="middle" fill="#555">相位彎得更多</text>

    <rect x="566" y="114" width="126" height="78" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="629" y="136" text-anchor="middle" font-weight="700" fill="#c2410c">SPH</text>
    <text x="629" y="155" text-anchor="middle">離焦 π + 球差 π</text>
    <text x="629" y="173" text-anchor="middle" fill="#555">不同的徑向相位</text>

    <rect x="700" y="114" width="126" height="78" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="763" y="136" text-anchor="middle" font-weight="700" fill="#c2410c">AST</text>
    <text x="763" y="155" text-anchor="middle">離焦 π + 像散 π</text>
    <text x="763" y="173" text-anchor="middle" fill="#555">不圓，但仍中心對稱</text>

    <rect x="834" y="114" width="136" height="78" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="902" y="136" text-anchor="middle" font-weight="700" fill="#b91c1c">COMA</text>
    <text x="902" y="155" text-anchor="middle">離焦 π + 彗差 π</text>
    <text x="902" y="173" text-anchor="middle" fill="#555">|P| 也不中心對稱</text>
  </g>
  <text x="30" y="212" font-size="12" fill="#555">灰 = 實數探針（沒有相位）　橘 = 複數、中心對稱　紅 = 複數、不中心對稱　　孔徑半徑 k_a 由事先寫定的幾何規則決定（範圍面積 ≤ 圓盤的第一個）</text>

  <!-- ===== 四種 HIO ===== -->
  <text x="30" y="250" font-size="15" font-weight="700" fill="#111">② 四種 HIO：知道的資訊由少到多（同一份量測、同一個隨機起點）</text>
  <g font-size="12" fill="#111">
    <rect x="30" y="262" width="215" height="92" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text x="137" y="286" text-anchor="middle" font-weight="700" font-size="14">A　只知道方框</text>
    <text x="137" y="308" text-anchor="middle">方框外 = 0、|ψ| ≤ 1</text>
    <text x="137" y="328" text-anchor="middle" fill="#555">不知道探針長怎樣</text>

    <rect x="270" y="262" width="215" height="92" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="377" y="286" text-anchor="middle" font-weight="700" font-size="14" fill="#4338ca">M　知道 |P|</text>
    <text x="377" y="308" text-anchor="middle">|ψ| ≤ |P|（軟的範圍）</text>
    <text x="377" y="328" text-anchor="middle" fill="#555">知道照在哪、多亮</text>

    <rect x="510" y="262" width="215" height="92" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="617" y="286" text-anchor="middle" font-weight="700" font-size="14" fill="#c2410c">K　知道整個 P（主角）</text>
    <text x="617" y="308" text-anchor="middle">ψ = P·O，O 振幅 ≤ 1、相位 0–π/2</text>
    <text x="617" y="328" text-anchor="middle" fill="#555">平頂圓盤時 = 4-1 的 P-HIO（差 0）</text>

    <rect x="750" y="262" width="220" height="92" rx="10" fill="#ecfdf5" stroke="#047857"/>
    <text x="860" y="286" text-anchor="middle" font-weight="700" font-size="14" fill="#047857">S　K + 真實範圍</text>
    <text x="860" y="308" text-anchor="middle">上限（實驗拿不到）</text>
    <text x="860" y="328" text-anchor="middle" fill="#555">平頂圓盤時 = 4-1 的 S*ψ</text>
  </g>
  <line x1="245" y1="308" x2="268" y2="308" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="485" y1="308" x2="508" y2="308" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="725" y1="308" x2="748" y2="308" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="137" y="374" font-size="12" text-anchor="middle" fill="#555">M − A：探針範圍還有沒有用</text>
  <text x="497" y="374" font-size="12" text-anchor="middle" fill="#555">K − M：知道探針相位有沒有幫助</text>
  <text x="860" y="374" font-size="12" text-anchor="middle" fill="#555">S − K：離上限多遠</text>

  <!-- ===== 翻轉的機制 ===== -->
  <text x="30" y="414" font-size="15" font-weight="700" fill="#111">③ 為什麼翻轉可能被打破</text>
  <g font-size="12.5" fill="#111">
    <rect x="30" y="426" width="455" height="150" rx="10" fill="#f8fafc" stroke="#334155"/>
    <text x="48" y="450" font-weight="700">翻轉解 = 把 ψ 轉 180° 再取共軛（繞射圖完全一樣）</text>
    <text x="48" y="474">中心對稱的探針下：翻轉解 = P × O′，O′ = (conj(P) / P) × 翻轉的物體</text>
    <text x="48" y="502" font-weight="700" fill="#475569">實數探針（DISK、AMP）：conj(P) / P = 1</text>
    <text x="64" y="522" fill="#555">→ O′ 只是相位反號，加個整體相位就合法 → 打不破（4-1 的 0.5）</text>
    <text x="48" y="548" font-weight="700" fill="#c2410c">複數探針：conj(P) / P 隨位置變</text>
    <text x="64" y="568" fill="#555">→ 物體相位對不上 0–π/2 → 翻轉解不合法（但只有知道相位的 K 看得出）</text>

    <rect x="505" y="426" width="465" height="150" rx="10" fill="#fff7ed" stroke="#c2410c"/>
    <text x="523" y="450" font-weight="700">事先算好的預測（校準集真值，不跑 HIO）</text>
    <text x="523" y="474">K 下翻轉解不合法的樣本：DEF / DEF2 / SPH / COMA 1.00、AST 0.99</text>
    <text x="523" y="496">DISK、AMP：0（打不破）</text>
    <text x="523" y="518">M 下：只有 COMA（|P| 不對稱）0.67，其餘 0</text>
    <text x="523" y="544" fill="#555">附帶效果：複數探針把頻譜攤開，被 beamstop 擋掉的能量</text>
    <text x="523" y="564" fill="#555">從 16% 降到 2–5% → 另跑 beamstop = 0 把兩種效果分開</text>
  </g>

  <!-- ===== 判讀 ===== -->
  <text x="30" y="612" font-size="15" font-weight="700" fill="#111">④ 判讀（結果出來前寫定，協定 §9.5）</text>
  <g font-size="12.5" fill="#111">
    <text x="30" y="636">(1) K 的「物體翻轉」比例 100 與 1000 次都 &lt; 0.2 → 打破　(2) M − A　(3) K − M　(4) S − K ≤ 0.05 → 接近上限</text>
    <text x="30" y="658">(5) 跨探針比錯掉的能量佔比：DEF vs AMP（相位的效果）、各探針 vs DISK　(6) beamstop = 0 診斷</text>
    <text x="30" y="682" font-weight="700" fill="#c2410c">→ 打破翻轉、且不比平頂圓盤差的複數探針中，誤差最小者 = 階段五的預設探針；沒有就維持 DISK（網路部分仍暫停）</text>
  </g>
</svg>
